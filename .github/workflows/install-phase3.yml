name: Install final Phase 3 website from ZIP
on:
  push:
    paths:
      - '.github/workflows/install-phase3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace old website with final submission
        shell: bash
        run: |
          set -euo pipefail
          test -f Needle_and_Muse_Phase3.zip
          mkdir -p /tmp/needle-phase3
          unzip -q Needle_and_Muse_Phase3.zip -d /tmp/needle-phase3
          src=/tmp/needle-phase3/Needle_and_Muse_Phase3
          test -f "$src/index.html"
          test -f "$src/style.css"
          test -f "$src/home.js"
          test -f "$src/images/logo-full.png"
          count=$(find "$src" -type f | wc -l)
          test "$count" -eq 47
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf -- {} +
          cp -a "$src/." .
          printf '%s\n' 'https://zahraalkubaish.github.io/Needle-Muse-Project/' > Link.txt
          rm -rf .github
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish final Phase 3 website and remove Phase 2 files"
          git push origin HEAD:main
